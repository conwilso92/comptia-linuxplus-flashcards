<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTIA Linux+ Flashcards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  .app { max-width: 700px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 1.4rem; text-align: center; margin-bottom: 4px; color: #f1f5f9; }
  .subtitle { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 24px; }
  .cat-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .cat-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; background: transparent; color: #94a3b8; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
  .cat-btn:hover { border-color: #60a5fa; color: #60a5fa; }
  .cat-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .progress-bar { flex: 1; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 3px; transition: width 0.4s; }
  .progress-text { font-size: 0.8rem; color: #64748b; white-space: nowrap; }
  .card-container { perspective: 1000px; margin-bottom: 20px; }
  .card { position: relative; width: 100%; min-height: 220px; cursor: pointer; transition: transform 0.5s; transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .card-front { background: linear-gradient(145deg, #1e293b, #162032); border: 1px solid #334155; }
  .card-back { background: linear-gradient(145deg, #1a2744, #152238); border: 1px solid #2d4a6f; transform: rotateY(180deg); }
  .card-cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #60a5fa; margin-bottom: 16px; font-weight: 600; }
  .card-question { font-size: 1.15rem; line-height: 1.5; color: #f1f5f9; }
  .card-hint-text { font-size: 0.78rem; color: #475569; margin-top: 10px; font-style: italic; }
  .card-answer { font-size: 1.2rem; line-height: 1.6; color: #a5f3fc; font-weight: 600; }
  .card-answer .acr-full { display: block; font-size: 0.85rem; color: #7dd3fc; font-weight: 400; margin-top: 6px; }
  .card-hint { font-size: 0.75rem; color: #475569; margin-top: 20px; }
  .conf-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .conf-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .conf-btn:hover { transform: translateY(-1px); }
  .conf-miss { background: #7f1d1d; color: #fca5a5; }
  .conf-miss:hover { background: #991b1b; }
  .conf-shaky { background: #78350f; color: #fcd34d; }
  .conf-shaky:hover { background: #92400e; }
  .conf-got { background: #14532d; color: #86efac; }
  .conf-got:hover { background: #166534; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; }
  .nav-btn { padding: 10px 22px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .nav-btn:hover { background: #334155; color: #e2e8f0; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .shuffle-btn { padding: 10px 22px; border-radius: 10px; border: 1px solid #334155; background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.85rem; }
  .shuffle-btn:hover { border-color: #8b5cf6; color: #a78bfa; }
  .stats { display: flex; justify-content: center; gap: 24px; margin-top: 24px; padding: 16px; background: #1e293b; border-radius: 12px; }
  .stat { text-align: center; }
  .stat-num { font-size: 1.3rem; font-weight: 700; }
  .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .stat-miss .stat-num { color: #f87171; }
  .stat-shaky .stat-num { color: #fbbf24; }
  .stat-got .stat-num { color: #4ade80; }
  .stat-unseen .stat-num { color: #64748b; }
  .filter-mode { text-align: center; font-size: 0.78rem; color: #64748b; margin-bottom: 6px; }
  .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
  .empty-state p { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const CARDS = [

  // ========== SYSTEM MANAGEMENT (23%) ==========
  { cat: "System Management", q: "What is the default filesystem on RHEL/CentOS/Rocky Linux?", a: "XFS" },
  { cat: "System Management", q: "What is the default filesystem on Debian/Ubuntu?", a: "ext4" },
  { cat: "System Management", q: "XFS vs ext4 — which can NOT be shrunk?", a: "XFS<span class='acr-full'>(XFS can only grow, never shrink)</span>" },
  { cat: "System Management", q: "Partition table required for UEFI and disks over 2TB", a: "GPT<span class='acr-full'>(GUID Partition Table)</span>" },
  { cat: "System Management", q: "Partition table used by legacy BIOS systems — 2TB max", a: "MBR<span class='acr-full'>(Master Boot Record — 2TB max, 4 primary partitions)</span>" },
  { cat: "System Management", q: "What command shows disk free space in human-readable format?", hint: "disk free", a: "df -h" },
  { cat: "System Management", q: "What command lists block devices and their mount points in a tree view?", hint: "block device tree", a: "lsblk" },
  { cat: "System Management", q: "What command shows UUIDs and filesystem types of block devices?", hint: "find disk UUIDs", a: "blkid<span class='acr-full'>(UUIDs are used in /etc/fstab for stable mounts)</span>" },
  { cat: "System Management", q: "What command must be run after editing a systemd unit file?", hint: "reload unit files", a: "systemctl daemon-reload" },
  { cat: "System Management", q: "What command shows disk usage of a directory?", hint: "disk usage", a: "du -sh /directory" },
  { cat: "System Management", q: "What command mounts a filesystem?", hint: "attach storage", a: "mount /dev/sdb1 /mnt/point" },
  { cat: "System Management", q: "What command unmounts a filesystem?", hint: "detach storage", a: "umount /mnt/point" },
  { cat: "System Management", q: "What file defines persistent mount points?", a: "/etc/fstab<span class='acr-full'>(File System Table)</span>" },
  { cat: "System Management", q: "What command checks and repairs a filesystem?", hint: "filesystem check", a: "fsck /dev/sda1<span class='acr-full'>(File System Check — must be unmounted first)</span>" },
  { cat: "System Management", q: "What command formats a partition with ext4?", hint: "make filesystem", a: "mkfs.ext4 /dev/sdb1" },
  { cat: "System Management", q: "What command creates an LVM physical volume?", hint: "LVM layer 1", a: "pvcreate /dev/sdb" },
  { cat: "System Management", q: "What command creates an LVM volume group?", hint: "LVM layer 2", a: "vgcreate vgname /dev/sdb" },
  { cat: "System Management", q: "What command creates an LVM logical volume?", hint: "LVM layer 3", a: "lvcreate -L 10G -n lvname vgname" },
  { cat: "System Management", q: "What command displays kernel version?", hint: "kernel info", a: "uname -r" },
  { cat: "System Management", q: "What command shows all hardware detected during boot?", hint: "kernel messages", a: "dmesg" },
  { cat: "System Management", q: "What command lists loaded kernel modules?", hint: "what's loaded now", a: "lsmod" },
  { cat: "System Management", q: "What command loads a module WITH its dependencies?", hint: "preferred over insmod", a: "modprobe module" },
  { cat: "System Management", q: "What command removes a running kernel module?", hint: "unload module", a: "rmmod module" },
  { cat: "System Management", q: "What command shows all running processes?", hint: "process snapshot", a: "ps aux" },
  { cat: "System Management", q: "What command shows real-time process and CPU usage?", hint: "live CPU monitor", a: "top" },
  { cat: "System Management", q: "What signal number force-kills a process?", a: "9<span class='acr-full'>(SIGKILL — use kill -9 PID)</span>" },
  { cat: "System Management", q: "What signal gracefully terminates a process?", a: "15<span class='acr-full'>(SIGTERM — default signal for kill)</span>" },
  { cat: "System Management", q: "What signal reloads a process configuration?", a: "1<span class='acr-full'>(SIGHUP — reload without restart)</span>" },
  { cat: "System Management", q: "What command shows available and used RAM?", hint: "memory check", a: "free -h" },
  { cat: "System Management", q: "What is PID 1 on a modern Linux system?", a: "systemd<span class='acr-full'>(First process started by the kernel)</span>" },
  { cat: "System Management", q: "What is a zombie process?", a: "A finished process whose parent hasn't released its PID<span class='acr-full'>(shows as Z in ps output)</span>" },

  // ========== FILE MANAGEMENT ==========
  { cat: "File Management", q: "What command searches for a pattern in a file?", hint: "pattern search", a: "grep" },
  { cat: "File Management", q: "What command prints specific fields from each line of input?", hint: "extract columns", a: "awk<span class='acr-full'>(e.g., awk '{print $1}' file — prints first field)</span>" },
  { cat: "File Management", q: "What command edits text streams non-interactively?", hint: "stream editor", a: "sed<span class='acr-full'>(e.g., sed 's/old/new/g' file — global find/replace)</span>" },
  { cat: "File Management", q: "What command extracts specific fields from lines using a delimiter?", hint: "cut columns", a: "cut -d':' -f1 /etc/passwd" },
  { cat: "File Management", q: "What command counts lines, words, and characters in a file?", hint: "count stuff", a: "wc<span class='acr-full'>(wc -l = lines only)</span>" },
  { cat: "File Management", q: "What command sorts lines in a file?", hint: "sort output", a: "sort" },
  { cat: "File Management", q: "What command removes consecutive duplicate lines from sorted output?", hint: "deduplicate", a: "uniq<span class='acr-full'>(use after sort — sort file | uniq)</span>" },
  { cat: "File Management", q: "What command creates a compressed archive?", hint: "pack files", a: "tar -czvf archive.tar.gz /path<span class='acr-full'>(-c create, -z gzip, -v verbose, -f filename)</span>" },
  { cat: "File Management", q: "What command extracts a tar archive?", hint: "unpack files", a: "tar -xzvf archive.tar.gz" },
  { cat: "File Management", q: "What command syncs files locally or to a remote host efficiently?", hint: "smart copy", a: "rsync<span class='acr-full'>(only transfers changed data — rsync -av src/ dest/)</span>" },
  { cat: "File Management", q: "What command finds files by name or type?", hint: "locate files live", a: "find /path -name \"filename\"" },
  { cat: "File Management", q: "What command displays file contents one page at a time (scroll both ways)?", hint: "pager, forward+back", a: "less" },
  { cat: "File Management", q: "What command follows a log file in real time?", hint: "live log watching", a: "tail -f /var/log/syslog" },
  { cat: "File Management", q: "What command shows detailed file metadata including inode?", hint: "file stats", a: "stat file" },
  { cat: "File Management", q: "What command creates a hard link?", hint: "same inode", a: "ln file hardlink" },
  { cat: "File Management", q: "What command creates a symbolic link?", hint: "pointer to filename", a: "ln -s target linkname" },
  { cat: "File Management", q: "Hard link vs symlink — which survives if the target is deleted?", a: "Hard link<span class='acr-full'>(data persists until all hard links are removed)</span>" },
  { cat: "File Management", q: "What command changes file permissions?", hint: "set rwx", a: "chmod" },
  { cat: "File Management", q: "What command changes file ownership?", hint: "change owner", a: "chown user:group file" },
  { cat: "File Management", q: "What numeric permission value equals rwxr-xr-x?", a: "755<span class='acr-full'>(owner=7 rwx, group=5 r-x, other=5 r-x)</span>" },
  { cat: "File Management", q: "What numeric permission value equals rw-r--r--?", a: "644<span class='acr-full'>(owner=6 rw-, group=4 r--, other=4 r--)</span>" },
  { cat: "File Management", q: "Permission bit that causes a file to execute with its owner's privileges — shown as s in owner execute position", a: "SUID<span class='acr-full'>(Set User ID)</span>" },
  { cat: "File Management", q: "What special permission bit prevents users from deleting others' files in a shared directory?", a: "Sticky bit<span class='acr-full'>(shown as t in other execute position — e.g., /tmp)</span>" },
  { cat: "File Management", q: "What command shows the default permission mask for new files?", hint: "default permissions", a: "umask" },
  { cat: "File Management", q: "What command provides extended ACL permissions beyond owner/group/other?", hint: "extra access control", a: "setfacl<span class='acr-full'>(Set File Access Control List)</span>" },
  { cat: "File Management", q: "What command views ACL permissions on a file?", hint: "view extra access", a: "getfacl<span class='acr-full'>(Get File Access Control List)</span>" },
  { cat: "File Management", q: "What is the pipe operator used for?", a: "| (pipe)<span class='acr-full'>(sends stdout of one command as stdin to the next)</span>" },
  { cat: "File Management", q: "What operator redirects stdout to a file, overwriting it?", a: "> (redirect)<span class='acr-full'>(e.g., command > file.txt)</span>" },
  { cat: "File Management", q: "What operator appends stdout to a file?", a: ">> (append redirect)" },
  { cat: "File Management", q: "What operator redirects stderr to a file?", a: "2> (stderr redirect)" },
  { cat: "File Management", q: "What command discards error output entirely?", hint: "silence errors", a: "command 2>/dev/null" },

  // ========== USERS & SERVICES (20%) ==========
  { cat: "Users & Services", q: "What file stores group names, GIDs, and group members?", a: "/etc/group<span class='acr-full'>(groupname:x:GID:member1,member2)</span>" },
  { cat: "Users & Services", q: "What command changes your active group for the current session?", hint: "switch active group", a: "newgrp groupname" },
  { cat: "Users & Services", q: "What file stores hashed passwords?", a: "/etc/shadow<span class='acr-full'>(readable by root only)</span>" },
  { cat: "Users & Services", q: "What UID does the root account always have?", a: "0" },
  { cat: "Users & Services", q: "At what UID do regular users typically start?", a: "1000" },
  { cat: "Users & Services", q: "What command creates a new user?", hint: "add account", a: "useradd username" },
  { cat: "Users & Services", q: "What command deletes a user AND their home directory?", hint: "remove+home", a: "userdel -r username" },
  { cat: "Users & Services", q: "What command adds a user to a supplementary group without removing them from others?", hint: "append group", a: "usermod -aG groupname username<span class='acr-full'>(-a is critical — omitting it removes other group memberships)</span>" },
  { cat: "Users & Services", q: "What command sets or changes a user's password?", hint: "change password", a: "passwd username" },
  { cat: "Users & Services", q: "What command manages password aging settings?", hint: "expiry settings", a: "chage<span class='acr-full'>(Change Age — chage -l username to view)</span>" },
  { cat: "Users & Services", q: "What command shows a user's UID, GID, and group memberships?", hint: "who am I?", a: "id username" },
  { cat: "Users & Services", q: "What is sudo vs su — key security difference?", a: "sudo runs one command, logged, uses own password; su gives full root shell, requires root's password" },
  { cat: "Users & Services", q: "What command safely edits the sudoers file?", hint: "never edit directly", a: "visudo" },
  { cat: "Users & Services", q: "Where is the sudoers file located?", a: "/etc/sudoers" },
  { cat: "Users & Services", q: "What init system replaced SysVinit on modern Linux?", a: "systemd<span class='acr-full'>(PID 1, parallel startup, journald logging)</span>" },
  { cat: "Users & Services", q: "What command checks a service's status?", hint: "is it running?", a: "systemctl status servicename" },
  { cat: "Users & Services", q: "What command enables a service to start at boot?", hint: "survive reboot", a: "systemctl enable servicename" },
  { cat: "Users & Services", q: "What command starts a service immediately?", hint: "start now", a: "systemctl start servicename" },
  { cat: "Users & Services", q: "What command completely prevents a service from starting even manually?", hint: "stronger than disable", a: "systemctl mask servicename" },
  { cat: "Users & Services", q: "What is the systemd equivalent of SysVinit runlevel 3 (multi-user CLI)?", a: "multi-user.target" },
  { cat: "Users & Services", q: "What is the systemd equivalent of SysVinit runlevel 5 (GUI)?", a: "graphical.target" },
  { cat: "Users & Services", q: "What command views logs for a specific service?", hint: "service logs", a: "journalctl -u servicename" },
  { cat: "Users & Services", q: "What command lists all failed services?", hint: "what broke?", a: "systemctl --failed" },
  { cat: "Users & Services", q: "What is the lowest (most critical) syslog severity level number?", a: "0<span class='acr-full'>(emerg — system unusable; 7 = debug, least critical)</span>" },
  { cat: "Users & Services", q: "What file configures the cron schedule for the root user?", a: "/var/spool/cron/root (or crontab -e)" },
  { cat: "Users & Services", q: "What is the cron field order?", a: "Minute Hour Day Month Weekday<span class='acr-full'>(* * * * * = run every minute)</span>" },

  // ========== NETWORKING ==========
  { cat: "Networking", q: "What command shows network interface IP addresses?", hint: "what's my IP?", a: "ip addr" },
  { cat: "Networking", q: "What command shows interface state (up/down) and MAC addresses?", hint: "interface status", a: "ip link" },
  { cat: "Networking", q: "What command manages NetworkManager connections from the CLI on RHEL?", hint: "RHEL network config", a: "nmcli<span class='acr-full'>(NetworkManager CLI — e.g., nmcli con show)</span>" },
  { cat: "Networking", q: "What command shows the routing table?", hint: "where does traffic go?", a: "ip route" },
  { cat: "Networking", q: "What command shows listening ports and active connections?", hint: "open ports", a: "ss -tuln<span class='acr-full'>(or netstat -tuln)</span>" },
  { cat: "Networking", q: "What command queries DNS records?", hint: "DNS lookup", a: "dig<span class='acr-full'>(or nslookup)</span>" },
  { cat: "Networking", q: "What command traces the network path to a host?", hint: "hop-by-hop path", a: "traceroute<span class='acr-full'>(or mtr for real-time)</span>" },
  { cat: "Networking", q: "What command captures network packets from the CLI?", hint: "packet sniffer", a: "tcpdump" },
  { cat: "Networking", q: "What file configures the DNS server used by the system?", a: "/etc/resolv.conf" },
  { cat: "Networking", q: "What file maps hostnames to IPs locally before DNS?", a: "/etc/hosts" },
  { cat: "Networking", q: "What file defines network interface configuration on RHEL?", a: "/etc/sysconfig/network-scripts/ifcfg-ethX" },
  { cat: "Networking", q: "What file defines network interface configuration on Debian/Ubuntu?", a: "/etc/network/interfaces" },
  { cat: "Networking", q: "What command enables IP forwarding (router mode)?", hint: "kernel routing", a: "sysctl -w net.ipv4.ip_forward=1" },
  { cat: "Networking", q: "What is the APIPA address range — what does it indicate?", a: "169.254.x.x<span class='acr-full'>(DHCP failure — self-assigned)</span>" },

  // ========== SECURITY (18%) ==========
  { cat: "Security", q: "What Linux security module enforces mandatory access control on RHEL?", a: "SELinux<span class='acr-full'>(Security-Enhanced Linux)</span>" },
  { cat: "Security", q: "What are the three SELinux modes?", a: "Enforcing, Permissive, Disabled" },
  { cat: "Security", q: "What command shows the current SELinux mode?", hint: "enforcing or not?", a: "getenforce" },
  { cat: "Security", q: "What command temporarily changes the SELinux mode?", hint: "runtime mode change", a: "setenforce 0 (Permissive) or setenforce 1 (Enforcing)" },
  { cat: "Security", q: "What file permanently configures SELinux mode?", a: "/etc/selinux/config" },
  { cat: "Security", q: "What Linux security module is the AppArmor alternative to SELinux?", a: "AppArmor<span class='acr-full'>(Default on Ubuntu/Debian — uses profiles instead of labels)</span>" },
  { cat: "Security", q: "What command is the frontend firewall manager on RHEL/Fedora?", hint: "RHEL firewall tool", a: "firewall-cmd<span class='acr-full'>(manages firewalld, which uses nftables underneath)</span>" },
  { cat: "Security", q: "What command is the frontend firewall manager on Ubuntu/Debian?", hint: "Ubuntu firewall tool", a: "ufw<span class='acr-full'>(Uncomplicated Firewall)</span>" },
  { cat: "Security", q: "What command applies permanent firewalld changes?", hint: "after --permanent", a: "firewall-cmd --reload" },
  { cat: "Security", q: "What command configures the underlying kernel packet filtering?", hint: "lower than firewalld", a: "nftables (or iptables for legacy)" },
  { cat: "Security", q: "What SSH config file disables root login?", a: "/etc/ssh/sshd_config<span class='acr-full'>(set PermitRootLogin no)</span>" },
  { cat: "Security", q: "What command generates an SSH key pair?", hint: "create SSH keys", a: "ssh-keygen" },
  { cat: "Security", q: "What file stores authorized public keys for SSH login?", a: "~/.ssh/authorized_keys" },
  { cat: "Security", q: "What command copies your SSH public key to a remote server?", hint: "push key to server", a: "ssh-copy-id user@host" },
  { cat: "Security", q: "Directory containing per-service authentication configuration files on Linux", a: "/etc/pam.d/<span class='acr-full'>(PAM = Pluggable Authentication Modules)</span>" },
  { cat: "Security", q: "Daemon that connects Linux systems to LDAP or Active Directory for centralized authentication", a: "SSSD<span class='acr-full'>(System Security Services Daemon)</span>" },
  { cat: "Security", q: "What command generates a hash of a file for integrity checking?", hint: "verify file integrity", a: "sha256sum filename<span class='acr-full'>(or md5sum — but SHA256 is preferred)</span>" },
  { cat: "Security", q: "What command checks RPM package file integrity?", hint: "RHEL package verify", a: "rpm -V packagename" },
  { cat: "Security", q: "What log file records sudo and authentication events on Debian?", a: "/var/log/auth.log<span class='acr-full'>(RHEL: /var/log/secure)</span>" },
  { cat: "Security", q: "What is the principle of least privilege?", a: "Users and processes receive only the minimum access needed to perform their job" },

  // ========== SCRIPTING & AUTOMATION (17%) ==========
  { cat: "Scripting", q: "What is the shebang line and what does it do?", a: "#!/bin/bash<span class='acr-full'>(First line of a script — specifies the interpreter)</span>" },
  { cat: "Scripting", q: "What command makes a script executable?", hint: "add execute bit", a: "chmod +x script.sh" },
  { cat: "Scripting", q: "What does an exit code of 0 mean?", a: "Success<span class='acr-full'>(non-zero = failure; check with echo $?)</span>" },
  { cat: "Scripting", q: "How do you check the exit code of the last command?", hint: "last return value", a: "echo $?" },
  { cat: "Scripting", q: "What environment variable stores the search path for executables?", a: "$PATH" },
  { cat: "Scripting", q: "What file runs for every new interactive Bash shell?", a: "~/.bashrc" },
  { cat: "Scripting", q: "What file runs once at login?", a: "~/.bash_profile" },
  { cat: "Scripting", q: "What is the && operator used for in scripting?", a: "Logical AND — cmd2 runs only if cmd1 succeeded" },
  { cat: "Scripting", q: "What is the || operator used for in scripting?", a: "Logical OR — cmd2 runs only if cmd1 failed" },
  { cat: "Scripting", q: "What command reads user input into a variable?", hint: "prompt user", a: "read VARNAME" },
  { cat: "Scripting", q: "What command makes a variable available to child processes?", hint: "env variable", a: "export VARNAME" },
  { cat: "Scripting", q: "What IaC tool uses declarative HCL language for infrastructure provisioning?", a: "Terraform" },
  { cat: "Scripting", q: "What is the difference between CI and CD?", a: "CI = automated testing on every commit; CD = automated deployment to production<span class='acr-full'>(Continuous Integration / Continuous Deployment)</span>" },

  // ========== CONTAINERS & TROUBLESHOOTING (22%) ==========
  { cat: "Containers & Troubleshooting", q: "What is the key difference between a container and a VM?", a: "Containers share the host OS kernel; VMs each have their own full OS" },

let deck = [...CARDS];
let idx = 0;
let flipped = false;
let filter = "All";
let scores = {};

function getFiltered() {
  if (filter === "All") return [...CARDS];
  if (filter === "Missed") return CARDS.filter(c => scores[c.q] === "miss");
  if (filter === "Shaky") return CARDS.filter(c => scores[c.q] === "shaky");
  return CARDS.filter(c => c.cat === filter);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function doShuffle() { deck = shuffle(getFiltered()); idx = 0; flipped = false; render(); }
function setFilter(f) { filter = f; deck = getFiltered(); idx = 0; flipped = false; render(); }
function flipCard() { flipped = !flipped; render(); }
function prev() { if (idx > 0) { idx--; flipped = false; render(); } }
function next() { if (idx < deck.length - 1) { idx++; flipped = false; render(); } }

function score(level) {
  if (deck.length === 0) return;
  scores[deck[idx].q] = level;
  if (idx < deck.length - 1) { idx++; flipped = false; }
  render();
}

function getStats() {
  let miss = 0, shaky = 0, got = 0, unseen = 0;
  CARDS.forEach(c => {
    const s = scores[c.q];
    if (s === "miss") miss++; else if (s === "shaky") shaky++; else if (s === "got") got++; else unseen++;
  });
  return { miss, shaky, got, unseen };
}

const cats = ["All", ...new Set(CARDS.map(c => c.cat)), "Missed", "Shaky"];

function render() {
  const app = document.getElementById("app");
  const stats = getStats();
  const total = deck.length;
  const progress = total > 0 ? ((idx + 1) / total * 100) : 0;
  const card = deck[idx];

  let catBtns = cats.map(c =>
    `<button class="cat-btn ${filter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}${c === "Missed" ? ` (${stats.miss})` : c === "Shaky" ? ` (${stats.shaky})` : ''}</button>`
  ).join('');

  let cardHTML = '';
  if (!card) {
    cardHTML = `<div class="empty-state"><p>No cards in this category yet.</p><p>Study more and mark cards to see them here!</p></div>`;
  } else {
    const hintHtml = card.hint ? `<div class="card-hint-text">(${card.hint})</div>` : '';
    cardHTML = `
      <div class="card-container">
        <div class="card ${flipped ? 'flipped' : ''}" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="card-cat">${card.cat}</div>
            <div class="card-question">${card.q}</div>
            ${hintHtml}
            <div class="card-hint">tap to reveal</div>
          </div>
          <div class="card-face card-back">
            <div class="card-cat">Answer</div>
            <div class="card-answer">${card.a}</div>
          </div>
        </div>
      </div>
      <div class="conf-row">
        <button class="conf-btn conf-miss" onclick="score('miss')">Missed</button>
        <button class="conf-btn conf-shaky" onclick="score('shaky')">Shaky</button>
        <button class="conf-btn conf-got" onclick="score('got')">Got it</button>
      </div>`;
  }

  app.innerHTML = `
    <h1>Linux+ Flashcards</h1>
    <div class="subtitle">XK0-006 · ${CARDS.length} cards · one question, one answer</div>
    <div class="cat-bar">${catBtns}</div>
    ${total > 0 ? `
    <div class="filter-mode">${filter !== "All" && filter !== "Missed" && filter !== "Shaky" ? filter + ' · ' : ''}${idx + 1} of ${total}</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">${Math.round(progress)}%</div>
    </div>` : ''}
    ${cardHTML}
    ${card ? `
    <div class="nav-row">
      <button class="nav-btn" onclick="prev()" ${idx === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="shuffle-btn" onclick="doShuffle()">Shuffle</button>
      <button class="nav-btn" onclick="next()" ${idx >= total - 1 ? 'disabled' : ''}>Next →</button>
    </div>` : ''}
    <div class="stats">
      <div class="stat stat-miss"><div class="stat-num">${stats.miss}</div><div class="stat-label">Missed</div></div>
      <div class="stat stat-shaky"><div class="stat-num">${stats.shaky}</div><div class="stat-label">Shaky</div></div>
      <div class="stat stat-got"><div class="stat-num">${stats.got}</div><div class="stat-label">Got It</div></div>
      <div class="stat stat-unseen"><div class="stat-num">${stats.unseen}</div><div class="stat-label">Unseen</div></div>
    </div>`;
}

doShuffle();
</script>
